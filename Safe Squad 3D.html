<style>

.act button{width:auto;display:inline-block;margin:6px 6px 0 0;padding:5px 10px;font-size:13px}.act{margin-top:6px}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const T=["Privacy","Passwords","Scam Radar","Stranger Sense","Cool Head","Reporting","Wallet Wisdom","Software Safety","Account Hygiene","Digital Footprint"];
const CTX=[["BlockCraft","gems","Discord"],["Galaxy Arena","credits","Telegram"],["Pixel Farm","coins","Snapchat"],["Rocket Drift","points","WhatsApp"],["Dungeon Kings","gold","Instagram"]];
const P=[
["Squad_Pal","hey ur good at {g}! whats ur real name, school and town? we can meet irl","Tell them my name, school and town","Say 'gamertag only, I keep real life separate'","Privacy","Stranger Sense","Strangers can combine name + school + town to find you. A gamertag is all anyone needs."],
["Rewards_Bot","CONGRATS! You won 10,000 {c}! Log in at {g}-rewards-login.co in the next 5 minutes!","Log in quickly before it expires","Ignore it and check the real in-game store","Scam Radar","Passwords","Fake urgency plus a fake login page is phishing. Real rewards only appear inside the official game."],
["Best_Friend_New","hey it's me, new account, old one got hacked. send ur password so i can test a login bug","Send it, it's my friend","Refuse, then message my friend on another app to check","Passwords","Scam Radar","Never share passwords, even with friends. Takeover scammers impersonate people you trust."],
["Mod_Maker","free {g} mod pack with aimbot + free skins. disable your antivirus to install it","Disable antivirus and install it","Only use mods from the official site or store","Software Safety","Account Hygiene","Random mods hide malware and token stealers. Disabling antivirus is a huge red flag."],
["Sponsor_Boss","you're really talented, I'll sponsor you. Move to {p}, don't tell your parents. Send a pic of your setup 😉","Add them, sponsorship sounds great","Refuse, keep the chat as evidence and stop replying","Stranger Sense","Privacy","Secrecy, moving to a private app and photo requests are classic grooming warning signs. Tell a trusted adult."],
["Rage_Player","you're trash, uninstall kid. i'll find u and ur family","Threaten back and trash talk","Mute them and don't engage","Cool Head","Reporting","Trolls want a reaction. Threats should always be reported with a screenshot."],
["Shop_Popup","LIMITED {g} bundle: $99.99. Use the saved card? Offer ends in 2 min!","Tap buy, it's only a game","Close it and ask whoever pays before buying anything","Wallet Wisdom","Cool Head","Countdown timers are designed to rush you. Use purchase PINs and spending limits."],
["Login_Alert","Your {g} account was just accessed from a new device in another country. Not you?","Ignore it, probably a glitch","Change my password, enable 2FA and log out other devices","Account Hygiene","Passwords","Act immediately. Use a unique password and an authenticator app, and never use links inside alert messages."],
["Stream_Fan","love your stream! I can see your street sign and the clock, you live near ___ right?","Laugh and confirm the area","Block them and fix what's visible on my stream","Digital Footprint","Privacy","Backgrounds, clocks, mail and street signs leak your location. Review streams and screenshots."],
["VIP_Admin","Admin here: to unlock the VIP channel on {p}, scan this QR code and confirm your phone number","Scan the QR and confirm","Ask a real moderator in the official server","Scam Radar","Account Hygiene","QR login scams hijack accounts. Verify staff through official channels."],
["Acc_Dealer","maxed {g} account for $20. pay first with gift cards, I'll send the login after","Buy it, such a good deal","Decline: gift cards and 'pay first' are scam markers","Wallet Wisdom","Scam Radar","Gift-card payments can't be reversed, and accounts that are sold can be reclaimed or banned."],
["Rank_Booster","I'll boost you to top rank for free. just share your {g} login so I can play on it","Share my login","Say no. Nobody should log into my account","Passwords","Account Hygiene","Account boosting breaks rules, gets you banned and exposes your account."],
["Mystery_DM","I have your photos. send money or I'll post them everywhere. Don't tell anyone","Pay to make it stop","Don't pay or reply, save evidence and tell a trusted adult","Stranger Sense","Reporting","Blackmail only grows if you pay. Stop contact, keep evidence and get help from an adult or the police."],
["Doxx_Troll","found your address from an old profile. you're done lol","Panic and message back to beg","Stay calm, screenshot, tighten privacy and tell an adult","Digital Footprint","Cool Head","Old profiles leak information. Lock down privacy settings and report. Don't engage."],
["{g}_Support","{g} Support: your account is banned. verify your card on this page to appeal","Enter my card details to appeal","Open the official support site myself instead","Scam Radar","Wallet Wisdom","Real support never asks for card details through chat links. Go to the official site directly."],
["Free_WiFi","Free WiFi: open network. log in to your {g} account here to play faster","Join and log in","Use my own mobile data or a trusted network","Account Hygiene","Software Safety","Open public networks can be spied on. Avoid logging in on them or use a trusted connection."],
["Voice_Troll","(voice chat) girls can't play, send a pic of you lol","Argue and send a pic to prove them wrong","Mute, leave the lobby and report them","Cool Head","Reporting","Harassment and photo demands should be reported. You never have to prove anything."],
["Clip_Sharer","check my insane clip! bit.ly/xk29-clip (login needed to watch)","Click and log in to watch","Skip it and don't click short links from strangers","Software Safety","Scam Radar","Short links hide the destination. Fake 'login to watch' pages steal accounts."],
["Team_Captain","tournament signup: need your phone number and home address for prizes","Send them, it's for prizes","Ask the organizers through their official site","Privacy","Scam Radar","Real tournaments use official forms. Don't share contact details in DMs."],
["Profile_Check","your {g} profile shows your school, birthday and city. anyone can see it","Leave it, it's fine","Switch the profile to private and delete personal details","Digital Footprint","Privacy","Profiles are public by default. Fewer details means fewer ways for others to find or impersonate you."]];
const SC=[];
for(let k=0;k<100;k++){const p=P[k%20],c=CTX[k/20|0],f=s=>s.replace(/\{g\}/g,c[0]).replace(/\{c\}/g,c[1]).replace(/\{p\}/g,c[2]);
SC.push({pl:c[2],w:f(p[0])+"_"+(10+k*7%90),m:f(p[1]),t1:p[4],t2:p[5],tip:f(p[6]),o:[[f(p[2]),0],[f(p[3]),1],["Screenshot it and tell a trusted adult or report it",2]]})}
let sc={};T.forEach(t=>sc[t]=50);const done=new Set(),total=()=>Math.round(T.reduce((a,t)=>a+sc[t],0)/T.length);
function bars(){$("tr").innerHTML=T.map(t=>`<div class="tr"><span>${t}</span><div class="bar"><i style="width:${sc[t]}%"></i></div><span>${sc[t]}</span></div>`).join("");$("prog").textContent="Situations done: "+done.size+"/100 · Safety score: "+total();$("tsc").textContent="🛡️ "+total();save()}
const bump=(t,d)=>sc[t]=Math.max(0,Math.min(100,sc[t]+d));
function rng(s){return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
